<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>支出合计 · 开发陪伴演示</title>
<style>
body{font:17px/1.7 system-ui,sans-serif;background:#f3f5f2;color:#16332d;margin:0;padding:8vh 20px}
main{max-width:560px;margin:auto;background:white;padding:36px;border:1px solid #d5dfd9;border-radius:16px}
small{color:#59726b}h1{font-size:32px;margin:12px 0}label{display:block;margin-top:24px}
input,button{font:inherit;border-radius:8px;padding:12px;box-sizing:border-box}input{width:100%;border:1px solid #9eb3a9;margin:8px 0}
button{border:0;background:#17684e;color:white;cursor:pointer;width:100%;margin-top:12px}button:disabled{opacity:.65}
output{display:block;min-height:42px;margin-top:24px;font-size:22px}p{color:#52665f}
</style>
<main><small>DEV COMPANION · 本地演示</small><h1>这次一共花了多少？</h1>
<p>输入支出金额，用逗号分隔。这个演示只计算合计，不会保存数据。</p>
<form id="sum-form"><label for="amounts">支出金额</label><input id="amounts" value="20,30" required autocomplete="off" aria-describedby="hint">
<small id="hint">例如：20,30。金额必须大于或等于 0。</small><button id="calculate">计算合计</button></form>
<output id="result" aria-live="polite">等待计算</output><small>自动化接口检查与真实用户试用分别记录。</small></main>
<script>
const form=document.querySelector('#sum-form'),button=document.querySelector('#calculate'),result=document.querySelector('#result');
form.addEventListener('submit',async event=>{
 event.preventDefault();button.disabled=true;result.textContent='正在计算…';
 try{
  const parts=document.querySelector('#amounts').value.trim().split(/[,，]/);
  if(parts.some(value=>!value.trim()))throw new Error('每一项都需要填写金额');
  const values=parts.map(Number);if(values.some(value=>!Number.isFinite(value)))throw new Error('请输入有效数字');
  const response=await fetch('/api/sum',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({values})});
  const data=await response.json();if(!response.ok)throw new Error(data.error);result.textContent=`合计：${data.total}`;
 }catch(error){result.textContent=`无法计算：${error.message}`;}finally{button.disabled=false;}
});
</script></html>
